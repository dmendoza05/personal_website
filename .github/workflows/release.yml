name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [ -z "$MERGE_SHA" ]; then
            echo "Merge commit SHA is missing."
            exit 1
          fi

          latest="$(
            git tag --list |
              grep -E '^[0-9]+\.[0-9]+$' |
              sort -t. -k1,1n -k2,2n |
              tail -n 1 || true
          )"

          if [ -z "$latest" ]; then
            next="0.1"
          else
            major="${latest%%.*}"
            minor="${latest#*.}"
            next="${major}.$((minor + 1))"
          fi

          if gh release view "$next" --json tagName >/dev/null 2>&1; then
            echo "Release ${next} already exists."
            exit 0
          fi

          gh release create "$next" \
            --target "$MERGE_SHA" \
            --title "$next" \
            --generate-notes
